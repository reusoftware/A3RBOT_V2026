<script>
async function login() {
    const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: user.value,
            password: pass.value
        })
    });

    const data = await res.json();

    if (data.ok) {
        localStorage.setItem("user", data.user.username);
        window.location.href = "/dashboard.html";
    } else {
        alert("❌ Invalid login");
    }
}
</script>
