<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>

<style>
body { font-family: Arial; background:#f5f5f5; }

#chatBox, #buzzBox {
    width:100%;
    height:200px;
    overflow:auto;
    background:white;
    padding:5px;
}

.msg { margin:5px; }

.join { color:green; font-weight:bold; }
.leave { color:darkgreen; font-weight:bold; }

.controls { margin:10px 0; }
</style>
</head>

<body>

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">LOGIN</button>
<p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<div class="controls">
<label><input type="checkbox" id="welcomeToggle" checked> Welcome Message</label>
<label><input type="checkbox" id="mathToggle"> Math Quiz</label>
</div>

<h3>ROOM</h3>
<input id="roomName" placeholder="Room name">
<button onclick="joinRoom()">JOIN</button>

<h4 id="subject"></h4>
<div id="users"></div>

<hr>

<div id="chatBox"></div>

<input id="msg">
<button onclick="sendMsg()">SEND</button>

<!-- EMOJI -->
<select onchange="addEmoji(this.value)">
<option value="">😊 Emoji</option>
<option>😀</option>
<option>😂</option>
<option>😍</option>
<option>🔥</option>
<option>👍</option>
<option>🎵</option>
<option>❤️</option>
</select>

<hr>

<h3>BUZZ</h3>
<div id="buzzBox"></div>

</div>

<script>

let socket;
let currentRoom = "";
let myUsername = "";

// ---------------- HELPERS ----------------
function addChat(html){
    chatBox.innerHTML += `<div class="msg">${html}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function addBuzz(html){
    buzzBox.innerHTML += `<div class="msg">${html}</div>`;
    buzzBox.scrollTop = buzzBox.scrollHeight;
}

// ---------------- LOGIN ----------------
function login(){

    myUsername = user.value;

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:user.value,
                password:pass.value,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{

        let msg = JSON.parse(e.data);

        switch(msg.handler){

        case "3rd_login":
            loginBox.style.display="none";
            main.style.display="block";
            status.innerText="Login success";
            break;

        case "join_room":
            subject.innerText = "📌 " + msg.subject;

            let list="";
            msg.members.forEach(m=>{
                list += m.username + "<br>";
            });
            users.innerHTML = list;
            break;

        // ---------------- JOIN / LEAVE ----------------
        case "room_presence":

            if(!welcomeToggle.checked) return;

            if(msg.status=="update"){
                addChat(`<span class="join">🟢 ${msg.username} joined</span>`);
            }

            if(msg.status=="left"){
                addChat(`<span class="leave">🔴 ${msg.username} left</span>`);
            }
            break;

        // ---------------- MESSAGE ----------------
        case "room_msg":

            // ❌ FIX DUPLICATE
            if(msg.message.sender === myUsername) return;

            renderMessage(msg.message);
            break;

        // ---------------- BUZZ ----------------
        case "new_buzz":
            renderBuzz(msg.data);
            break;
        }
    };
}

// ---------------- MESSAGE ----------------
function renderMessage(m){

    let html = `<b>${m.sender}</b>: ${m.body || ""}`;

    if(m.attachments){

        m.attachments.forEach(url=>{

            if(url.match(/\.(jpg|png|jpeg|gif)/i)){
                html += `<br><img src="${url}" width="150">`;
            }

            else if(url.match(/\.(mp3|aac|wav|ogg)/i)){
                html += `<br><audio controls src="${url}"></audio>`;
            }

            else if(url.match(/\.(mp4|webm)/i)){
                html += `<br><video width="200" controls src="${url}"></video>`;
            }

            else{
                html += `<br><a href="${url}" target="_blank">file</a>`;
            }
        });
    }

    addChat(html);
}

// ---------------- BUZZ ----------------
function renderBuzz(b){

    let html = `<b>🔥 ${b.username}</b><br>${b.content}<br>❤️ ${b.likes_count}`;

    if(b.attachments){

        b.attachments.forEach(url=>{

            if(url.match(/\.(jpg|png|jpeg|gif)/i)){
                html += `<br><img src="${url}" width="150">`;
            }

            else if(url.match(/\.(mp3|aac|wav|ogg)/i)){
                html += `<br><audio controls src="${url}"></audio>`;
            }

            else if(url.match(/\.(mp4|webm)/i)){
                html += `<br><video width="200" controls src="${url}"></video>`;
            }

            else{
                html += `<br>${url}`;
            }
        });
    }

    addBuzz(html);
}

// ---------------- JOIN ----------------
function joinRoom(){

    currentRoom = roomName.value;

    socket.send(JSON.stringify({
        handler:"join_room",
        payload:{ room_name: currentRoom }
    }));
}

// ---------------- SEND ----------------
function sendMsg(){

    let text = msg.value;

    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: text
        }
    }));

    // show ONLY once (ME)
    addChat(`<b>ME</b>: ${text}`);

    msg.value="";
}

// ---------------- EMOJI ----------------
function addEmoji(e){
    msg.value += e;
}

</script>

</body>
</html>
