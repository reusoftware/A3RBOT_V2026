<!DOCTYPE html>
<html>
<head>
    <title>A3R WEB BOT</title>

    <style>
        body { font-family: Arial; }

        #chatBox {
            width: 90%;
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin: 10px auto;
            background: #f9f9f9;
            text-align: left;
        }

        #controls {
            text-align: center;
            margin-top: 10px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h2 align="center">🤖 A3R WEB BOT</h2>

<!-- LOGIN -->
<div id="loginDiv" style="text-align:center;">
    <input id="user" placeholder="Username"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">LOGIN</button>
    <p id="status"></p>
</div>

<!-- CHAT UI -->
<div id="chatUI" style="display:none;">

    <div id="controls">
        <input id="room" placeholder="Room Name">
        <button onclick="joinRoom()">JOIN ROOM</button>
    </div>

    <div id="chatBox"></div>

    <div id="controls">
        <input id="msg" placeholder="Type message..." style="width:60%;">
        <button onclick="sendMsg()">SEND</button>
    </div>

</div>

<script>
let socket;
let currentRoom = "";

// ================= LOGIN =================
function login() {
    const username = document.getElementById("user").value;
    const password = document.getElementById("pass").value;
    const status = document.getElementById("status");

    if (!username || !password) {
        status.innerText = "❌ Enter username & password";
        return;
    }

    status.innerText = "⏳ Connecting to chat server...";

    socket = new WebSocket("wss://viberschat.space:8443/server");

    // CONNECTED
    socket.onopen = () => {
        status.innerText = "🔐 Sending login...";

        const loginPacket = {
            handler: "3rd_login",
            payload: {
                username: username,
                password: password,
                api_key: "xYn86hjOpJk$"
            }
        };

        console.log("SEND:", loginPacket);
        socket.send(JSON.stringify(loginPacket));
    };

    // RECEIVE ANY MESSAGE (IMPORTANT FIX)
    socket.onmessage = (event) => {
        console.log("RECEIVED:", event.data);

        // 🔥 ALWAYS SHOW MESSAGE
        addChat(event.data);

        // 🔥 AUTO OPEN CHAT UI (like VB.NET behavior)
        document.getElementById("loginDiv").style.display = "none";
        document.getElementById("chatUI").style.display = "block";

        document.getElementById("status").innerText = "✅ Connected (receiving data)";
    };

    socket.onerror = () => {
        status.innerText = "❌ Connection error";
    };

    socket.onclose = () => {
        console.log("Disconnected");
    };
}

// ================= JOIN ROOM =================
function joinRoom() {
    const room = document.getElementById("room").value;
    currentRoom = room;

    if (!room) {
        addChat("❌ Enter room name");
        return;
    }

    const packet = {
        handler: "room_join",
        payload: { room: room }
    };

    socket.send(JSON.stringify(packet));

    addChat("➡️ Joining room: " + room);
}

// ================= SEND MESSAGE =================
function sendMsg() {
    const msg = document.getElementById("msg").value;

    if (!msg) return;

    const packet = {
        handler: "room_message",
        payload: {
            room: currentRoom,
            body: msg
        }
    };

    socket.send(JSON.stringify(packet));

    document.getElementById("msg").value = "";
}

// ================= CHAT DISPLAY =================
function addChat(text) {
    const box = document.getElementById("chatBox");

    const line = document.createElement("div");
    line.innerText = text;

    box.appendChild(line);

    // auto scroll
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
