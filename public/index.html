<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>

<style>
body { font-family: Arial; background:#f5f5f5; }

#chatBox {
    width:100%;
    height:250px;
    overflow:auto;
    background:white;
    padding:5px;
}

.msg { margin:5px; }

.join { color:green; font-weight:bold; }
.leave { color:darkgreen; font-weight:bold; }

.controls { margin:10px 0; }

#users {
    background:#fff;
    padding:5px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">LOGIN</button>
<p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<div class="controls">
<label><input type="checkbox" id="welcomeToggle" checked> Welcome</label>
<label><input type="checkbox" id="mathToggle" onchange="toggleMath()"> Quiz</label>
<button onclick="enableBattleMode()">Battle Mode</button>
</div>

<h3>ROOM</h3>
<input id="roomName" placeholder="Room name">
<button onclick="joinRoom()">JOIN</button>

<h4 id="subject"></h4>

<div id="users"></div>

<hr>

<div id="chatBox"></div>

<input id="msg">
<button onclick="sendMsg()">SEND</button>

</div>

<script>

let socket;
let currentRoom = "";
let myUsername = "";
let quizType = "math"; // math or word
// ================= USERS =================
let usersList = [];

// ================= QUIZ =================
let quizActive = false;
let quizMode = "normal";

let currentAnswer = null;
let questionStartTime = 0;

let repeatTimer = null;
let repeatCount = 0;

let maxRepeats = 5;

let answeredThisRound = new Set();
let lastAnswerTime = {};
let cooldown = 1500;

// ================= SCORES =================
let userScores = {};
let userBestSpeed = {};

// ================= UI =================
function addChat(html){
    chatBox.innerHTML += `<div class="msg">${html}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function updateUsers(list){
    usersList = list || [];
    users.innerHTML = usersList.map(u => u).join("<br>");
}

// ================= LOGIN =================
function login(){

    myUsername = user.value;

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        status.innerText = "Connecting...";

        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:user.value,
                password:pass.value,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{

        let msg = JSON.parse(e.data);

        switch(msg.handler){

        // ================= LOGIN =================
        case "3rd_login":
            loginBox.style.display="none";
            main.style.display="block";
            status.innerText="Login success";
            break;

        // ================= ROOM JOIN =================
        case "join_room":
            if(msg.members){
                updateUsers(msg.members.map(m=>m.username));
            }
            subject.innerText = msg.subject || "";
            break;

        // ================= LIVE USER LIST =================
        case "room_lists":
            updateUsers(msg.online);
            break;

        // ================= PRESENCE FIXED =================
        case "room_presence":

            if(msg.username === myUsername) return;

            if(msg.status === "update"){
                addChat(`<span class="join">🟢 ${msg.username} joined the room</span>`);

                if(!usersList.includes(msg.username)){
                    usersList.push(msg.username);
                    updateUsers(usersList);
                }

                if(welcomeToggle.checked){
                    let w = ["Welcome!", "Hello!", "Enjoy!", "Nice to see you!"];
                    sendBot(`👋 ${msg.username} ${w[Math.floor(Math.random()*w.length)]}`);
                }
            }

            if(msg.status === "left"){
                addChat(`<span class="leave">🔴 ${msg.username} left the room</span>`);
                usersList = usersList.filter(u => u !== msg.username);
                updateUsers(usersList);
            }

        break;

        // ================= CHAT =================
        case "room_msg":

            let m = msg.message;
            renderMessage(m);

            if(m.sender === myUsername) break;

            let text = (m.body || "").toLowerCase().trim();

            // ---------- COMMAND: MYSCORE ----------
            if(text === "myscore"){

                let s = userScores[m.sender] || 0;
                let sp = userBestSpeed[m.sender];

                sendBot(
                    sp
                    ? `📊 ${m.sender} | Score: ${s} | Best: ${sp.toFixed(2)}s`
                    : `📊 ${m.sender} | Score: ${s}`
                );
                return;
            }

            // ---------- COMMAND: TOP ----------
            if(text === "top"){

                let arr = Object.keys(userScores);

                if(arr.length === 0){
                    sendBot("🏆 No players yet!");
                    return;
                }

                arr.sort((a,b)=> userScores[b] - userScores[a]);

                let out = "🏆 TOP PLAYERS:\n";

                arr.slice(0,10).forEach((p,i)=>{
                    out += `${i+1}. ${p} | ${userScores[p]} pts\n`;
                });

                sendBot(out);
                return;
            }

            // ================= QUIZ CHECK =================
            if(!quizActive || currentAnswer === null) return;

        let userAnswer = m.body.trim().toLowerCase();

let isCorrect = false;

if(quizType === "math"){
    isCorrect = parseInt(userAnswer) === currentAnswer;
} else {
    isCorrect = userAnswer === currentAnswer;
}

if(!isCorrect) return;
            if(isNaN(ans)) return;

          //  if(answeredThisRound.has(m.sender)) return;

            let now = Date.now();
            if(lastAnswerTime[m.sender] && now - lastAnswerTime[m.sender] < cooldown) return;

         if(ans === currentAnswer){

    // 🛑 STOP ROUND
    clearInterval(repeatTimer);
    currentAnswer = null; // lock question

    answeredThisRound.add(m.sender);
    lastAnswerTime[m.sender] = now;

    let timeTaken = (now - questionStartTime) / 1000;

    let scoreGain =
        timeTaken <= 2 ? 100 :
        timeTaken <= 5 ? 70 :
        timeTaken <= 8 ? 50 : 30;

    // ✅ INIT PLAYER
    if(!userScores[m.sender]){
        userScores[m.sender] = 0;
        userBestSpeed[m.sender] = 999;
    }

    userScores[m.sender] += scoreGain;

    // ✅ SAVE BEST SPEED
    if(timeTaken < userBestSpeed[m.sender]){
        userBestSpeed[m.sender] = timeTaken;
    }

    // ✅ SHOW FULL RESULT
    sendBot(
        `🏆 ${m.sender} +${scoreGain} pts (${timeTaken.toFixed(2)}s)\n` +
        `📊 Total Score: ${userScores[m.sender]} | Best: ${userBestSpeed[m.sender].toFixed(2)}s`
    );

    // ✅ NEXT QUESTION (FOR BOTH MODES)
    setTimeout(()=>{
        nextQuestion();
    }, 4000);
}
 
        break;
        }
    };
}

// ================= BOT =================
function sendBot(text){
    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: text
        }
    }));
}

// ================= MESSAGE =================
function renderMessage(m){
    addChat(`<b>${m.sender}</b>: ${m.body || ""}`);
}

// ================= ROOM =================
function joinRoom(){

    currentRoom = roomName.value;

    socket.send(JSON.stringify({
        handler:"join_room",
        payload:{ room_name: currentRoom }
    }));
}

// ================= SEND =================
function sendMsg(){

    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: msg.value
        }
    }));

    msg.value="";
}

// ================= QUIZ ENGINE =================
function nextQuestion(){

    clearInterval(repeatTimer);

    answeredThisRound.clear();
    repeatCount = 0;

    questionStartTime = Date.now();

    // 🔁 SWITCH MODE
    quizType = (quizType === "math") ? "word" : "math";

    let questionText = "";

    if(quizType === "math"){

        let a = Math.floor(Math.random()*20);
        let b = Math.floor(Math.random()*20);

        currentAnswer = a + b;
        questionText = `🧮 ${a} + ${b} = ?`;

    } else {

        // WORD QUIZ
        let words = [
            {q:"Unscramble: 'tca'", a:"cat"},
            {q:"Opposite of 'hot'?", a:"cold"},
            {q:"Fill: 2,4,6,?", a:"8"},
            {q:"What is color of sky?", a:"blue"},
            {q:"Spell correctly: 'aple'", a:"apple"}
        ];

        let pick = words[Math.floor(Math.random()*words.length)];

        currentAnswer = pick.a.toLowerCase();
        questionText = `🧠 WORD: ${pick.q}`;
    }

    sendBot(questionText);

    repeatTimer = setInterval(()=>{

        if(currentAnswer === null) return;

        repeatCount++;

        sendBot(`⏳ REPEAT: ${questionText}`);

        if(repeatCount >= maxRepeats){

            clearInterval(repeatTimer);

            sendBot(`❌ Time up! Answer: ${currentAnswer}`);

            currentAnswer = null;

            setTimeout(nextQuestion, 5000);
        }

    }, 15000);
}
// ================= TOGGLE =================
function toggleMath(){

    if(mathToggle.checked){

        if(quizActive) return;

        quizActive = true;
        quizMode = "normal";

        sendBot("🧠 Quiz Started!");
        nextQuestion();

    } else {

        quizActive = false;
        clearInterval(repeatTimer);

        sendBot("🛑 Quiz Stopped");
    }
}

// ================= BATTLE MODE =================
function enableBattleMode(){
    quizMode = "battle";
    sendBot("🏁 Battle Mode ON!");
}

</script>

</body>
</html>
