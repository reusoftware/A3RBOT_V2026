<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>

<style>
body { font-family: Arial; background:#f5f5f5; }

#chatBox {
    width:100%;
    height:250px;
    overflow:auto;
    background:white;
    padding:5px;
}

.msg { margin:5px; }

.join { color:green; font-weight:bold; }
.leave { color:darkgreen; font-weight:bold; }

.controls { margin:10px 0; }

#users {
    background:#fff;
    padding:5px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">LOGIN</button>
<p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<div class="controls">
<label><input type="checkbox" id="welcomeToggle" checked> Welcome</label>
<label><input type="checkbox" id="mathToggle" onchange="toggleMath()"> Quiz</label>
<button onclick="enableBattleMode()">Battle Mode</button>
</div>

<h3>ROOM</h3>
<input id="roomName" placeholder="Room name">
<button onclick="joinRoom()">JOIN</button>

<h4 id="subject"></h4>

<div id="users"></div>

<hr>

<div id="chatBox"></div>

<input id="msg">
<button onclick="sendMsg()">SEND</button>

</div>

<script>

let socket;
let currentRoom = "";
let myUsername = "";
let quizType = "math";

// ================= USERS =================
let usersList = [];
let autoScroll = true;

// ================= QUIZ =================
let quizActive = false;
let currentAnswer = null;
let questionStartTime = 0;

let repeatTimer = null;
let repeatCount = 0;
let maxRepeats = 5;

let lastAnswerTime = {};
let cooldown = 1500;

// ================= SCORES =================
let userScores = {};
let userBestSpeed = {};

let quizModes = ["math", "word", "guess", "trivia"];
let quizIndex = 0;

// ================= UI =================
function addChat(html){

    chatBox.innerHTML += `<div class="msg">${html}</div>`;

    if(autoScroll){
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

function updateUsers(list){
    usersList = list || [];
    users.innerHTML = usersList.join("<br>");
}

// ================= LOGIN =================
function login(){

    myUsername = user.value;

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        status.innerText = "Connecting...";
        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:user.value,
                password:pass.value,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{

        let msg = JSON.parse(e.data);

        switch(msg.handler){

        case "3rd_login":
            loginBox.style.display="none";
            main.style.display="block";
            status.innerText="Login success";
        break;

        case "join_room":
            if(msg.members){
                updateUsers(msg.members.map(m=>m.username));
            }
            subject.innerText = msg.subject || "";
        break;

        case "room_lists":
            updateUsers(msg.online || []);
        break;

        case "room_presence":

            if(msg.username === myUsername) return;

            if(msg.status==="update"){
                addChat(`🟢 ${msg.username} joined`);

                if(!usersList.includes(msg.username)){
                    usersList.push(msg.username);
                    updateUsers(usersList);
                }

                if(welcomeToggle.checked){
                    sendBot(`👋 Welcome ${msg.username}!`);
                }
            }

            if(msg.status==="left"){
                addChat(`🔴 ${msg.username} left`);
                usersList = usersList.filter(u=>u!==msg.username);
                updateUsers(usersList);
            }

        break;

        case "room_msg":

            let m = msg.message;
            renderMessage(m);

            if(m.sender === myUsername) return;

            let text = (m.body || "").toLowerCase().trim();

            // ================= COMMANDS =================
            if(text === "myscore"){
                let s = userScores[m.sender] || 0;
                let sp = userBestSpeed[m.sender];

                sendBot(
                    sp
                    ? `📊 ${m.sender} | ${s} pts | ⚡ ${sp.toFixed(2)}s`
                    : `📊 ${m.sender} | ${s} pts`
                );
                return;
            }

            if(text === "top"){
                let arr = Object.keys(userScores);

                if(arr.length === 0){
                    sendBot("🏆 No players yet!");
                    return;
                }

                arr.sort((a,b)=> userScores[b] - userScores[a]);

                let out = "🏆 TOP PLAYERS:\n";

                arr.slice(0,10).forEach((p,i)=>{
                    out += `${i+1}. ${p} | ${userScores[p]} pts\n`;
                });

                sendBot(out);
                return;
            }

            // ================= QUIZ CHECK =================
            if(!quizActive || currentAnswer === null) return;

            // Anti-spam (ONLY during quiz)
            let now = Date.now();
            if(lastAnswerTime[m.sender] && now - lastAnswerTime[m.sender] < cooldown)
                return;

            // Guess mode anti-spam
            if(quizType === "guess" && text.length > 2) return;

            let correct = false;

            if(quizType === "math" || quizType === "guess"){
                correct = parseInt(text) === currentAnswer;
            } else {
                correct = text === currentAnswer;
            }

            if(!correct) return;

            // ✅ STOP ROUND
            clearInterval(repeatTimer);
            currentAnswer = null;

            lastAnswerTime[m.sender] = now;

            let timeTaken = (now - questionStartTime)/1000;

            let score =
                timeTaken <= 2 ? 100 :
                timeTaken <= 5 ? 70 :
                timeTaken <= 8 ? 50 : 30;

            if(!userScores[m.sender]){
                userScores[m.sender] = 0;
                userBestSpeed[m.sender] = 999;
            }

            userScores[m.sender] += score;

            if(timeTaken < userBestSpeed[m.sender]){
                userBestSpeed[m.sender] = timeTaken;
            }

            sendBot(
                `🏆 ${m.sender} +${score} (${timeTaken.toFixed(2)}s)\n` +
                `📊 Total: ${userScores[m.sender]} | Best: ${userBestSpeed[m.sender].toFixed(2)}s`
            );

            setTimeout(nextQuestion, 4000);

        break;
        }
    };
}

// ================= BOT =================
function sendBot(text){
    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: text
        }
    }));
}

// ================= MESSAGE =================
function renderMessage(m){

    let html = `<b>${m.sender}</b>: ${m.body || ""}`;

    if(m.attachments && m.attachments.length > 0){

        m.attachments.forEach(url => {

            // 🔥 FIX: convert to HTTPS upload server
            let safeUrl = url
              function fixUrl(url){

    if(!url) return "";

    return url
        .replace(/^http:\/\/www\.viberschat\.space:5666/i, "https://viberschat.space:2053")
        .replace(/^http:\/\/viberschat\.space:5666/i, "https://viberschat.space:2053");
}

            let cleanUrl = safeUrl.split("?")[0];

            // ===== IMAGE =====
            if(/\.(jpg|jpeg|png|gif|webp)$/i.test(cleanUrl)){

                html += `
                <div>
                    <img src="${safeUrl}" 
                         style="max-width:200px;border-radius:8px;margin-top:5px;cursor:pointer"
                         onclick="openImage('${safeUrl}')">
                </div>`;
            }

            // ===== AUDIO =====
            else if(/\.(mp3|aac|wav|ogg|m4a)$/i.test(cleanUrl)){

                html += `
                <div>
                    <audio controls style="margin-top:5px">
                        <source src="${safeUrl}">
                    </audio>
                </div>`;
            }

            // ===== VIDEO =====
            else if(/\.(mp4|webm)$/i.test(cleanUrl)){

                html += `
                <div>
                    <video controls width="250" style="margin-top:5px">
                        <source src="${safeUrl}">
                    </video>
                </div>`;
            }

            // ===== UNKNOWN =====
            else{
                html += `
                <div>
                    📎 <a href="${safeUrl}" target="_blank">Open file</a>
                </div>`;
            }

        });
    }

    addChat(html);
}
// ================= ROOM =================
function joinRoom(){
    currentRoom = roomName.value;

    socket.send(JSON.stringify({
        handler:"join_room",
        payload:{ room_name: currentRoom }
    }));
}

// ================= SEND =================
function sendMsg(){

    if(!msg.value.trim()) return;

    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: msg.value
        }
    }));

    msg.value="";
}

// ================= QUIZ ENGINE =================
async function nextQuestion(){

    clearInterval(repeatTimer);

    repeatCount = 0;
    questionStartTime = Date.now();

    quizType = quizModes[quizIndex];
    quizIndex = (quizIndex + 1) % quizModes.length;

    let questionText = "";

    if(quizType === "math"){

        let ops = ["+", "-", "*"];
        let op = ops[Math.floor(Math.random()*ops.length)];

        let a = Math.floor(Math.random()*20)+1;
        let b = Math.floor(Math.random()*20)+1;

        if(op === "-"){
            if(b > a){ [a,b] = [b,a]; }
            currentAnswer = a - b;
        }
        else if(op === "*"){
            a = Math.floor(Math.random()*10)+1;
            b = Math.floor(Math.random()*10)+1;
            currentAnswer = a * b;
        }
        else{
            currentAnswer = a + b;
        }

        questionText = `🧮 ${a} ${op} ${b} = ?`;
    }

    else if(quizType === "word"){

        let words = ["apple","banana","tiger","house","water","robot","music"];
        let word = words[Math.floor(Math.random()*words.length)];

        let scrambled = word.split('').sort(()=>Math.random()-0.5).join('');

        currentAnswer = word;
        questionText = `🧠 Unscramble: ${scrambled}`;
    }

    else if(quizType === "guess"){

        currentAnswer = Math.floor(Math.random()*50)+1;
        questionText = `🎯 Guess number (1-50)`;
    }

    else if(quizType === "trivia"){

        let q = await fetchTrivia();

        if(q){
            questionText = q;
        } else {
            currentAnswer = "test";
            questionText = "🌍 Trivia failed.";
        }
    }

    sendBot(questionText);

    repeatTimer = setInterval(()=>{

        if(currentAnswer === null) return;

        repeatCount++;

        sendBot(`⏳ ${questionText}`);

        if(repeatCount >= maxRepeats){

            clearInterval(repeatTimer);

            sendBot(`❌ Time up! Answer: ${currentAnswer}`);

            currentAnswer = null;

            setTimeout(nextQuestion, 4000);
        }

    },15000);
}

// ================= TOGGLE =================
function toggleMath(){

    if(mathToggle.checked){

        if(quizActive) return;

        quizActive = true;

        sendBot("🧠 Fun Quiz Started!");
        nextQuestion();

    } else {

        quizActive = false;
        clearInterval(repeatTimer);

        sendBot("🛑 Quiz Stopped");
    }
}

// ================= TRIVIA =================
async function fetchTrivia(){

    try{
        let res = await fetch("https://opentdb.com/api.php?amount=1&type=multiple");
        let data = await res.json();

        let q = data.results[0];

        let txt = document.createElement("textarea");
        txt.innerHTML = q.question;

        let ans = document.createElement("textarea");
        ans.innerHTML = q.correct_answer;

        currentAnswer = ans.value.toLowerCase();

        return `🌍 TRIVIA: ${txt.value}`;

    } catch{
        return null;
    }
}

// ================= SCROLL =================
chatBox.addEventListener("scroll", () => {
    autoScroll =
        chatBox.scrollTop + chatBox.clientHeight >= chatBox.scrollHeight - 10;
});
function openImage(url){

    let modal = document.createElement("div");

    modal.style.position = "fixed";
    modal.style.top = 0;
    modal.style.left = 0;
    modal.style.width = "100%";
    modal.style.height = "100%";
    modal.style.background = "rgba(0,0,0,0.8)";
    modal.style.display = "flex";
    modal.style.alignItems = "center";
    modal.style.justifyContent = "center";
    modal.style.zIndex = 9999;

    modal.innerHTML = `
        <img src="${url}" style="max-width:90%;max-height:90%;border-radius:10px">
    `;

    modal.onclick = () => modal.remove();

    document.body.appendChild(modal);
}

    
</script>

</body>
</html>
