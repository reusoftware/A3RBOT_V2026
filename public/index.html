<!DOCTYPE html>
<html>
<head>
    <title>A3R BOT LOGIN</title>
</head>
<body style="font-family:Arial; text-align:center; margin-top:100px;">

<h2>🤖 A3R BOT LOGIN</h2>

<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>

<button onclick="login()">LOGIN BOT</button>

<p id="status"></p>

<script>
let socket;

function login() {
    const username = document.getElementById("user").value;
    const password = document.getElementById("pass").value;
    const status = document.getElementById("status");

    if (!username || !password) {
        status.innerText = "❌ Enter username & password";
        return;
    }

    status.innerText = "⏳ Connecting to chat server...";

    // 🔥 CONNECT TO YOUR REAL CHAT SERVER
    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        status.innerText = "🔐 Sending login...";

        const loginPacket = {
            handler: "3rd_login",
            payload: {
                username: username,
                password: password,
                api_key: "xYn86hjOpJk$"
            }
        };

        socket.send(JSON.stringify(loginPacket));
    };

    socket.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);

            console.log("SERVER:", msg);

            // 🔥 IMPORTANT: SHOW RESULT EVEN IF FORMAT DIFFERENT
            if (msg.handler === "login_result") {
                if (msg.ok === true) {
                    status.innerText = "✅ BOT CONNECTED!";
                } else {
                    status.innerText = "❌ LOGIN FAILED: " + (msg.message || "Unknown");
                }
            } else {
                // fallback (your server may not send handler)
                status.innerText = "⚠️ Response: " + JSON.stringify(msg);
            }

        } catch (e) {
            status.innerText = "⚠️ Raw: " + event.data;
        }
    };

    socket.onerror = () => {
        status.innerText = "❌ Connection Error (CORS / blocked)";
    };

    socket.onclose = () => {
        console.log("Disconnected");
    };
}
</script>

</body>
</html>
