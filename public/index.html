<script>

let socket;
let currentRoom = "";
let myUsername = "";

// QUIZ SYSTEM
let quizActive = false;
let currentAnswer = null;
let currentQuestion = "";
let repeatCount = 0;
let quizTimer = null;
let scores = {}; // username -> score

// ---------------- HELPERS ----------------
function addChat(html){
    chatBox.innerHTML += `<div class="msg">${html}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function updateUserList(arr){
    let list="";
    arr.forEach(u=> list += u + "<br>");
    users.innerHTML = list;
}

// ---------------- LOGIN ----------------
function login(){

    myUsername = user.value;

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:user.value,
                password:pass.value,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{

        let msg = JSON.parse(e.data);

        switch(msg.handler){

        case "3rd_login":
            loginBox.style.display="none";
            main.style.display="block";
            break;

        case "join_room":
            updateUserList(msg.members.map(m=>m.username));
            break;

        case "room_lists":
            updateUserList(msg.online);
            break;

        // JOIN / LEAVE + WELCOME
        case "room_presence":

            if(msg.status === "update"){
                addChat(`<span class="join">🟢 ${msg.username} joined</span>`);

                if(welcomeToggle.checked){
                    let welcomes = [
                        "Welcome!",
                        "Hello 👋",
                        "Glad you joined!",
                        "Welcome to the room!",
                        "Enjoy your stay 😄"
                    ];

                    let w = welcomes[Math.floor(Math.random()*welcomes.length)];

                    sendBot(`👋 ${msg.username}, ${w}`);
                }
            }

            if(msg.status === "left"){
                addChat(`<span class="leave">🔴 ${msg.username} left</span>`);
            }

            break;

        // CHAT MESSAGE
        case "room_msg":

            let m = msg.message;

            renderMessage(m);

            // 🧠 CHECK QUIZ ANSWER
            if(quizActive && m.body){

                let answer = parseInt(m.body.trim());

                if(answer === currentAnswer){

                    if(!scores[m.sender]){
                        scores[m.sender] = 0;
                        sendBot(`🎉 ${m.sender} joined Quiz! Score: 0`);
                    }

                    scores[m.sender]++;

                    sendBot(`✅ ${m.sender} got it! Score: ${scores[m.sender]}`);

                    nextQuestion();
                }
            }

            break;
        }
    };
}

// ---------------- BOT SEND ----------------
function sendBot(text){
    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: text
        }
    }));
}

// ---------------- MESSAGE RENDER ----------------
function renderMessage(m){

    let html = `<b>${m.sender}</b>: ${m.body || ""}`;
    addChat(html);
}

// ---------------- JOIN ----------------
function joinRoom(){

    currentRoom = roomName.value;

    socket.send(JSON.stringify({
        handler:"join_room",
        payload:{ room_name: currentRoom }
    }));
}

// ---------------- SEND ----------------
function sendMsg(){

    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: msg.value
        }
    }));

    msg.value="";
}

// ---------------- QUIZ SYSTEM ----------------
function generateQuestion(){

    let a = Math.floor(Math.random()*10);
    let b = Math.floor(Math.random()*10);

    currentAnswer = a + b;
    currentQuestion = `${a} + ${b} = ?`;

    repeatCount = 0;

    askRepeated();
}

function askRepeated(){

    quizTimer = setInterval(()=>{

        repeatCount++;

        sendBot(`🧠 QUIZ: ${currentQuestion}`);

        if(repeatCount >= 5){

            clearInterval(quizTimer);

            sendBot(`⏰ Time's up! Answer: ${currentAnswer}`);

            setTimeout(()=>{
                generateQuestion();
            }, 3000);
        }

    }, 10000);
}

function nextQuestion(){

    clearInterval(quizTimer);

    setTimeout(()=>{
        generateQuestion();
    }, 3000);
}

// ---------------- TOGGLE ----------------
function toggleMath(){

    if(mathToggle.checked){

        quizActive = true;
        sendBot("🧠 Quiz Started!");
        generateQuestion();

    } else {

        quizActive = false;
        clearInterval(quizTimer);
        sendBot("🛑 Quiz Stopped");
    }
}

</script>
