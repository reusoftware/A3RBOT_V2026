<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>
</head>

<body style="font-family:Arial">

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
    <input id="user" placeholder="Username"><br><br>
    <input id="pass" type="password" placeholder="Password"><br><br>
    <button onclick="login()">LOGIN</button>
    <p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

    <h3>ROOM</h3>
    <input id="roomName" placeholder="Room name">
    <button onclick="joinRoom()">JOIN ROOM</button>

    <br><br>

    <textarea id="chatBox" style="width:100%;height:150px"></textarea>

    <br>

    <input id="msg" placeholder="Message">
    <button onclick="sendMsg()">SEND</button>

    <hr>

    <h3>BUZZ</h3>
    <textarea id="buzzBox" style="width:100%;height:120px"></textarea>

    <hr>

    <h3>RAW</h3>
    <textarea id="rawBox" style="width:100%;height:120px"></textarea>

    <hr>

    <h3>USERS</h3>
    <textarea id="userBox" style="width:100%;height:120px"></textarea>

</div>

<script>

let socket;
let currentRoom = "";

function $(id) {
    return document.getElementById(id);
}

function logRaw(t) {
    $("rawBox").value += t + "\n";
    $("rawBox").scrollTop = $("rawBox").scrollHeight;
}

function logChat(t) {
    $("chatBox").value += t + "\n";
    $("chatBox").scrollTop = $("chatBox").scrollHeight;
}

function logBuzz(t) {
    $("buzzBox").value += t + "\n";
    $("buzzBox").scrollTop = $("buzzBox").scrollHeight;
}

function logUsers(list) {
    $("userBox").value = list.join("\n");
}

function login() {

    const username = $("user").value;
    const password = $("pass").value;

    if (!username || !password) {
        $("status").innerText = "❌ Enter credentials";
        return;
    }

    $("status").innerText = "⏳ Connecting...";

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        $("status").innerText = "🔐 Logging in...";

        socket.send(JSON.stringify({
            handler: "3rd_login",
            payload: {
                username,
                password,
                api_key: "xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e) => {

        let msg;

        try {
            msg = JSON.parse(e.data);
        } catch {
            logRaw("INVALID: " + e.data);
            return;
        }

        logRaw(JSON.stringify(msg));

        // LOGIN RESULT
        if (msg.handler === "3rd_login") {

            if (msg.status === "success") {
                $("status").innerText = "✅ LOGIN SUCCESS";

                $("loginBox").style.display = "none";
                $("main").style.display = "block";

            } else {
                $("status").innerText = "❌ LOGIN FAILED";
            }
        }

        // JOIN ROOM
        if (msg.handler === "join_room" && msg.status === "success") {

            logChat("📥 Joined room");
            logUsers(msg.members.map(m => m.username));
        }

        // ROOM USERS UPDATE
        if (msg.handler === "room_lists") {
            logUsers(msg.online || []);
        }

        // PRESENCE
        if (msg.handler === "room_presence") {
            logChat("👤 " + msg.username + " " + msg.status);
        }

        // ROOM MESSAGE
        if (msg.handler === "room_msg") {
            const m = msg.message;
            logChat("💬 " + m.sender + ": " + m.body);
        }

        // BUZZ
        if (msg.handler === "new_buzz") {
            const b = msg.data;
            logBuzz("📢 " + b.username + ": " + b.content);
        }
    };

    socket.onerror = () => {
        $("status").innerText = "❌ SOCKET ERROR";
    };
}

function joinRoom() {

    const room = $("roomName").value;
    if (!room) return;

    currentRoom = room;

    socket.send(JSON.stringify({
        handler: "join_room",
        payload: { room_name: room }
    }));

    logChat("➡️ Joining " + room);
}

function sendMsg() {

    const text = $("msg").value;
    if (!text || !currentRoom) return;

    socket.send(JSON.stringify({
        handler: "room_msg",
        payload: {
            room_name: currentRoom,
            body: text
        }
    }));

    logChat("ME: " + text);
}

</script>

</body>
</html>
