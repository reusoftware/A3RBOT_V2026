<!DOCTYPE html>
<html>
<head>
    <title>A3R WEB BOT</title>
    <style>
        body { font-family: Arial; }

        #chatBox {
            width: 90%;
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin: 10px auto;
            background: #f9f9f9;
            text-align: left;
        }

        #controls {
            text-align: center;
            margin-top: 10px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h2 align="center">🤖 A3R WEB BOT</h2>

<!-- LOGIN -->
<div id="loginDiv" style="text-align:center;">
    <input id="user" placeholder="Username"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">LOGIN</button>
    <p id="status"></p>
</div>

<!-- CHAT UI -->
<div id="chatUI" style="display:none;">

    <div id="controls">
        <input id="room" placeholder="Room Name">
        <button onclick="joinRoom()">JOIN ROOM</button>
    </div>

    <div id="chatBox"></div>

    <div id="controls">
        <input id="msg" placeholder="Type message..." style="width:60%;">
        <button onclick="sendMsg()">SEND</button>
    </div>

</div>

<script>
let socket;
let currentUser = "";
let currentRoom = "";

// ===== LOGIN =====
function login() {
    const username = document.getElementById("user").value;
    const password = document.getElementById("pass").value;
    const status = document.getElementById("status");

    if (!username || !password) {
        status.innerText = "❌ Enter credentials";
        return;
    }

    currentUser = username;

    status.innerText = "⏳ Connecting...";

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        const loginPacket = {
            handler: "3rd_login",
            payload: {
                username: username,
                password: password,
                api_key: "xYn86hjOpJk$"
            }
        };

        socket.send(JSON.stringify(loginPacket));
    };

    socket.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            console.log(msg);

            // LOGIN RESULT
            if (msg.handler === "login_result") {
                if (msg.ok) {
                    status.innerText = "✅ Connected!";
                    document.getElementById("loginDiv").style.display = "none";
                    document.getElementById("chatUI").style.display = "block";
                } else {
                    status.innerText = "❌ Login failed";
                }
                return;
            }

            // DISPLAY EVERYTHING ELSE
            addChat(JSON.stringify(msg));

        } catch {
            addChat(event.data);
        }
    };

    socket.onerror = () => {
        status.innerText = "❌ Connection error";
    };
}

// ===== JOIN ROOM =====
function joinRoom() {
    const room = document.getElementById("room").value;
    currentRoom = room;

    const packet = {
        handler: "room_join",
        payload: {
            room: room
        }
    };

    socket.send(JSON.stringify(packet));
    addChat("➡️ Joined room: " + room);
}

// ===== SEND MESSAGE =====
function sendMsg() {
    const msg = document.getElementById("msg").value;

    if (!msg) return;

    const packet = {
        handler: "room_message",
        payload: {
            room: currentRoom,
            body: msg
        }
    };

    socket.send(JSON.stringify(packet));
    document.getElementById("msg").value = "";
}

// ===== CHAT DISPLAY (RTF STYLE) =====
function addChat(text) {
    const box = document.getElementById("chatBox");

    const line = document.createElement("div");
    line.innerText = text;

    box.appendChild(line);

    // auto scroll
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
