<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>

<style>
body { font-family: Arial; background:#f5f5f5; }

#chatBox {
    width:100%;
    height:250px;
    overflow:auto;
    background:white;
    padding:5px;
}

.msg { margin:5px; }

.join { color:green; font-weight:bold; }
.leave { color:darkgreen; font-weight:bold; }

.controls { margin:10px 0; }
</style>
</head>

<body>

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">LOGIN</button>
<p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<div class="controls">
<label><input type="checkbox" id="welcomeToggle" checked> Welcome</label>
<label><input type="checkbox" id="mathToggle" onchange="toggleMath()"> Math Quiz</label>
</div>

<h3>ROOM</h3>
<input id="roomName" placeholder="Room name">
<button onclick="joinRoom()">JOIN</button>

<h4 id="subject"></h4>
<div id="users"></div>

<hr>

<div id="chatBox"></div>

<input id="msg">
<button onclick="sendMsg()">SEND</button>

<select onchange="addEmoji(this.value)">
<option value="">😊 Emoji</option>
<option>😀</option>
<option>😂</option>
<option>😍</option>
<option>🔥</option>
<option>👍</option>
<option>🎵</option>
<option>❤️</option>
</select>

</div>

<script>

let socket;
let currentRoom = "";
let myUsername = "";

// QUIZ
let quizActive = false;
let currentAnswer = null;
let currentQuestion = "";
let repeatCount = 0;
let quizTimer = null;
let scores = {};

// ---------------- UI ----------------
function addChat(html){
    chatBox.innerHTML += `<div class="msg">${html}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function updateUsers(list){
    users.innerHTML = list.map(u => u).join("<br>");
}

// ---------------- LOGIN ----------------
function login(){

    myUsername = user.value;

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        status.innerText = "Connecting...";
        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:user.value,
                password:pass.value,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{

        let msg = JSON.parse(e.data);

        switch(msg.handler){

        case "3rd_login":
            loginBox.style.display="none";
            main.style.display="block";
            status.innerText="Login success";
            break;

        case "join_room":
            updateUsers(msg.members.map(m=>m.username));
            break;

        case "room_lists":
            updateUsers(msg.online);
            break;

        case "room_presence":

            if(msg.status==="update"){
                addChat(`<span class="join">🟢 ${msg.username} joined</span>`);

                updateUsers([...users.innerText.split("\n"), msg.username]);

                if(welcomeToggle.checked){
                    let arr = ["Welcome!", "Hello!", "Enjoy!", "Nice to see you!"];
                    sendBot(`👋 ${msg.username}, ${arr[Math.floor(Math.random()*arr.length)]}`);
                }
            }

            if(msg.status==="left"){
                addChat(`<span class="leave">🔴 ${msg.username} left</span>`);

                let list = users.innerText.split("\n").filter(u => u !== msg.username);
                updateUsers(list);
            }

            break;

        case "room_msg":

            let m = msg.message;

            renderMessage(m);

            // QUIZ CHECK
            if(quizActive && m.body){

                let ans = parseInt(m.body.trim());

                if(ans === currentAnswer){

                    if(!scores[m.sender]){
                        scores[m.sender] = 0;
                        sendBot(`🎉 ${m.sender} joined quiz! Score: 0`);
                    }

                    scores[m.sender]++;
                    sendBot(`✅ ${m.sender} correct! Score: ${scores[m.sender]}`);

                    nextQuestion();
                }
            }

            break;
        }
    };
}

// ---------------- BOT SEND ----------------
function sendBot(text){
    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: text
        }
    }));
}

// ---------------- MESSAGE ----------------
function renderMessage(m){
    addChat(`<b>${m.sender}</b>: ${m.body}`);
}

// ---------------- JOIN ----------------
function joinRoom(){

    currentRoom = roomName.value;

    socket.send(JSON.stringify({
        handler:"join_room",
        payload:{ room_name: currentRoom }
    }));
}

// ---------------- SEND ----------------
function sendMsg(){

    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: msg.value
        }
    }));

    msg.value="";
}

// ---------------- EMOJI ----------------
function addEmoji(e){
    msg.value += e;
}

// ---------------- QUIZ ----------------
function generateQuestion(){

    let a = Math.floor(Math.random()*10);
    let b = Math.floor(Math.random()*10);

    currentAnswer = a + b;
    currentQuestion = `${a} + ${b} = ?`;

    repeatCount = 0;

    askLoop();
}

function askLoop(){

    quizTimer = setInterval(()=>{

        repeatCount++;

        sendBot(`🧠 QUIZ: ${currentQuestion}`);

        if(repeatCount >= 5){

            clearInterval(quizTimer);

            sendBot(`⏰ Answer: ${currentAnswer}`);

            setTimeout(generateQuestion,3000);
        }

    },10000);
}

function nextQuestion(){
    clearInterval(quizTimer);
    setTimeout(generateQuestion,3000);
}

// ---------------- TOGGLE ----------------
function toggleMath(){

    if(mathToggle.checked){

        quizActive = true;
        sendBot("🧠 Quiz Started!");
        generateQuestion();

    } else {

        quizActive = false;
        clearInterval(quizTimer);
        sendBot("🛑 Quiz Stopped");
    }
}

</script>

</body>
</html>
