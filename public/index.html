<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>
</head>

<body style="font-family:Arial">

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
    <input id="user" placeholder="Username"><br><br>
    <input id="pass" type="password" placeholder="Password"><br><br>
    <button onclick="login()">LOGIN</button>
    <p id="status"></p>
</div>

<!-- MAIN PANEL -->
<div id="main" style="display:none">

    <h3>ROOM</h3>
    <input id="roomName" placeholder="Room name">
    <button onclick="joinRoom()">JOIN ROOM</button>

    <br><br>

    <textarea id="chatBox" style="width:100%;height:150px" placeholder="Room Chat"></textarea>

    <br>

    <input id="msg" placeholder="Message">
    <button onclick="sendMsg()">SEND</button>

    <hr>

    <h3>BUZZ</h3>
    <textarea id="buzzBox" style="width:100%;height:120px"></textarea>

    <hr>

    <h3>RAW RESPONSE</h3>
    <textarea id="rawBox" style="width:100%;height:120px"></textarea>

</div>

<script>

let socket;
let currentRoom = "";

function logRaw(text) {
    const box = document.getElementById("rawBox");
    box.value += text + "\n";
    box.scrollTop = box.scrollHeight;
}

function logChat(text) {
    const box = document.getElementById("chatBox");
    box.value += text + "\n";
    box.scrollTop = box.scrollHeight;
}

function logBuzz(text) {
    const box = document.getElementById("buzzBox");
    box.value += text + "\n";
    box.scrollTop = box.scrollHeight;
}

function login() {
    const username = document.getElementById("user").value;
    const password = document.getElementById("pass").value;
    const status = document.getElementById("status");

    if (!username || !password) {
        status.innerText = "❌ Enter credentials";
        return;
    }

    status.innerText = "⏳ Connecting...";

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        status.innerText = "🔐 Logging in...";

        socket.send(JSON.stringify({
            handler: "3rd_login",
            payload: {
                username,
                password,
                api_key: "xYn86hjOpJk$"
            }
        }));
    };

  socket.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    console.log(msg);

    logMessage("RAW: " + JSON.stringify(msg));

    switch(msg.handler) {

        case "3rd_login":
            status.innerText = "Login OK";
            break;

        case "join_room":
            if(msg.status === "success") {

                updateUsers(msg.members.map(m => m.username));
                subject.innerText = msg.subject || "No subject";
            }
            break;

        case "room_lists":
            updateUsers(msg.online || []);
            break;

        case "room_presence":
            logMessage("👤 " + msg.username + " " + msg.status);
            break;

        case "room_msg":
            const m = msg.message;
            addChat("💬 " + m.sender + ": " + m.body);
            break;

        case "new_buzz":
            logMessage("📢 " + msg.data.username + ": " + msg.data.content);
            break;

        default:
            logMessage("UNKNOWN: " + msg.handler);
    }
};

function joinRoom() {
    const room = document.getElementById("roomName").value;

    if (!room) return;

    currentRoom = room;

    socket.send(JSON.stringify({
        handler: "join_room",
        payload: {
            room_name: room
        }
    }));

    logChat("➡️ Joining: " + room);
}

function sendMsg() {
    const text = document.getElementById("msg").value;

    if (!text || !currentRoom) return;

    socket.send(JSON.stringify({
        handler: "room_msg",
        payload: {
            room_name: currentRoom,
            body: text
        }
    }));

    logChat("ME: " + text);
}

</script>

</body>
</html>
