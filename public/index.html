<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>

<style>
body { font-family: Arial; background:#f5f5f5; }

#chatBox {
    width:100%;
    height:250px;
    overflow:auto;
    background:white;
    padding:5px;
}

.msg { margin:5px; }

.join { color:green; font-weight:bold; }
.leave { color:darkgreen; font-weight:bold; }

.controls { margin:10px 0; }
</style>
</head>

<body>

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">LOGIN</button>
<p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<div class="controls">
<label><input type="checkbox" id="welcomeToggle" checked> Welcome</label>
<label><input type="checkbox" id="mathToggle" onchange="toggleMath()"> Math Quiz</label>
</div>

<h3>ROOM</h3>
<input id="roomName" placeholder="Room name">
<button onclick="joinRoom()">JOIN</button>

<h4 id="subject"></h4>
<div id="users"></div>

<hr>

<div id="chatBox"></div>

<input id="msg">
<button onclick="sendMsg()">SEND</button>

<select onchange="addEmoji(this.value)">
<option value="">😊 Emoji</option>
<option>😀</option>
<option>😂</option>
<option>😍</option>
<option>🔥</option>
<option>👍</option>
<option>🎵</option>
<option>❤️</option>
</select>

</div>

<script>

let socket;
let currentRoom = "";
let myUsername = "";

// ================= QUIZ STATE =================
let quizActive = false;
let currentAnswer = null;
let questionStartTime = 0;

let repeatTimer = null;
let repeatCount = 0;
let maxRepeats = 5;

// 🧠 MODE CONTROL (NORMAL / BATTLE)
let quizMode = "normal";

// ================= PLAYER DATA =================
let userScores = {};
let userBestSpeed = {};
let lastAnswerTime = {};

let cooldown = 2000;
let answeredThisRound = new Set();

// ================= LOCAL STORAGE =================
function loadData(){
    userScores = JSON.parse(localStorage.getItem("scores") || "{}");
    userBestSpeed = JSON.parse(localStorage.getItem("speed") || "{}");
}

function saveData(){
    localStorage.setItem("scores", JSON.stringify(userScores));
    localStorage.setItem("speed", JSON.stringify(userBestSpeed));
}

// ================= UI =================
function addChat(html){
    chatBox.innerHTML += `<div class="msg">${html}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function updateUsers(list){
    users.innerHTML = list.map(u => u).join("<br>");
}

// ================= LOGIN =================
function login(){

    myUsername = user.value;

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        status.innerText = "Connecting...";
        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:user.value,
                password:pass.value,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{

        let msg = JSON.parse(e.data);

        switch(msg.handler){

        case "3rd_login":
            loginBox.style.display="none";
            main.style.display="block";
            status.innerText="Login success";
            loadData();
            break;

        case "join_room":
            updateUsers(msg.members.map(m=>m.username));
            break;

        case "room_lists":
            updateUsers(msg.online);
            break;

        // ================= JOIN / LEAVE =================
        case "room_presence":

            if(msg.username === myUsername) return;

            if(msg.status==="update"){
                addChat(`<span class="join">🟢 ${msg.username} joined</span>`);
            }

            if(msg.status==="left"){
                addChat(`<span class="leave">🔴 ${msg.username} left</span>`);
            }

        break;

        // ================= CHAT MESSAGE =================
        case "room_msg":

            let m = msg.message;
            renderMessage(m);

            if(m.sender === myUsername) break;

            let text = (m.body || "").toLowerCase().trim();

            // ========== COMMAND: MYSCORE ==========
            if(text === "myscore"){
                let score = userScores[m.sender] || 0;
                let speed = userBestSpeed[m.sender];

                sendBot(
                    speed
                    ? `📊 ${m.sender} | Score: ${score} | Best: ${speed.toFixed(2)}s`
                    : `📊 ${m.sender} | Score: ${score} | No speed yet`
                );
                return;
            }

            // ========== COMMAND: TOP ==========
            if(text === "top"){

                let players = Object.keys(userScores);

                if(players.length === 0){
                    sendBot("🏆 No players yet!");
                    return;
                }

                players.sort((a,b)=> userScores[b] - userScores[a]);

                let msgTop = "🏆 TOP PLAYERS:\n";

                players.slice(0,10).forEach((p,i)=>{
                    msgTop += `${i+1}. ${p} | ${userScores[p]} pts\n`;
                });

                sendBot(msgTop);
                return;
            }

            // ========== QUIZ ANSWER ==========
            if(!quizActive || currentAnswer === null) return;

            let ans = parseInt(m.body);
            if(isNaN(ans)) return;

            if(answeredThisRound.has(m.sender)) return;

            let now = Date.now();

            if(lastAnswerTime[m.sender] && now - lastAnswerTime[m.sender] < cooldown)
                return;

            if(ans === currentAnswer){

                answeredThisRound.add(m.sender);
                lastAnswerTime[m.sender] = now;

                let timeTaken = (now - questionStartTime) / 1000;

                let scoreGain =
                    timeTaken <= 2 ? 100 :
                    timeTaken <= 5 ? 70 :
                    timeTaken <= 8 ? 50 : 30;

                userScores[m.sender] = (userScores[m.sender] || 0) + scoreGain;

                if(!userBestSpeed[m.sender] || timeTaken < userBestSpeed[m.sender]){
                    userBestSpeed[m.sender] = timeTaken;
                }

                saveData();

                sendBot(
                    `🏆 ${m.sender} +${scoreGain} pts (${timeTaken.toFixed(2)}s)`
                );

                // 🧠 BATTLE MODE = instant next question
                if(quizMode === "battle"){
                    clearInterval(repeatTimer);
                    setTimeout(nextQuestion, 3000);
                }
            }

        break;
        }
    };
}

// ================= BOT =================
function sendBot(text){
    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: text
        }
    }));
}

// ================= MESSAGE =================
function renderMessage(m){
    addChat(`<b>${m.sender}</b>: ${m.body || ""}`);
}

// ================= QUIZ ENGINE =================
function nextQuestion(){

    let a = Math.floor(Math.random()*20);
    let b = Math.floor(Math.random()*20);

    currentAnswer = a + b;
    questionStartTime = Date.now();

    repeatCount = 0;
    answeredThisRound.clear();

    sendBot(`🧠 QUIZ: ${a} + ${b} = ?`);

    repeatTimer = setInterval(()=>{

        repeatCount++;

        sendBot(`⏳ QUIZ: ${a} + ${b} = ?`);

        if(repeatCount >= maxRepeats){

            clearInterval(repeatTimer);

            sendBot(`❌ Time up! Answer: ${currentAnswer}`);

            setTimeout(nextQuestion, 5000);
        }

    }, 10000);
}

// ================= TOGGLE =================
function toggleMath(){

    if(mathToggle.checked){

        if(quizActive) return;

        quizActive = true;
        quizMode = "normal";

        sendBot("🧠 Normal Quiz Started!");
        nextQuestion();

    } else {

        quizActive = false;
        clearInterval(repeatTimer);

        sendBot("🛑 Quiz Stopped");
    }
}

// ================= BATTLE MODE =================
function enableBattleMode(){

    quizMode = "battle";

    sendBot("🏁 Battle Mode Activated!");
}

</script>

</body>
</html>
