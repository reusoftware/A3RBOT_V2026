<!DOCTYPE html>
<html>
<head>
<title>A3R BOT</title>

<style>
body { font-family: Arial; background:#f5f5f5; }

#chatBox {
    width:100%;
    height:250px;
    overflow:auto;
    background:white;
    padding:5px;
}

.msg { margin:5px; }

.join { color:green; font-weight:bold; }
.leave { color:darkgreen; font-weight:bold; }

.controls { margin:10px 0; }
</style>
</head>

<body>

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">LOGIN</button>
<p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<div class="controls">
<label><input type="checkbox" id="welcomeToggle" checked> Welcome</label>
<label><input type="checkbox" id="mathToggle" onchange="toggleMath()"> Math Quiz</label>
</div>

<h3>ROOM</h3>
<input id="roomName" placeholder="Room name">
<button onclick="joinRoom()">JOIN</button>

<h4 id="subject"></h4>
<div id="users"></div>

<hr>

<div id="chatBox"></div>

<input id="msg">
<button onclick="sendMsg()">SEND</button>

<select onchange="addEmoji(this.value)">
<option value="">😊 Emoji</option>
<option>😀</option>
<option>😂</option>
<option>😍</option>
<option>🔥</option>
<option>👍</option>
<option>🎵</option>
<option>❤️</option>
</select>

</div>

<script>

let socket;
let currentRoom = "";
let myUsername = "";
let answeredThisRound = new Set();
let lastAnswerTime = {};
let cooldown = 2000; // 2 sec spam protection
// ---------------- QUIZ SYSTEM ----------------
let quizActive = false;
let currentAnswer = null;
let questionStartTime = 0;
let repeatTimer = null;
let repeatCount = 0;
let maxRepeats = 5;

let userScores = {};      // total score
let userBestSpeed = {};   // fastest time (seconds)

// ---------------- UI ----------------
function addChat(html){
    chatBox.innerHTML += `<div class="msg">${html}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function updateUsers(list){
    users.innerHTML = list.map(u => u).join("<br>");
}
function loadData(){
    userScores = JSON.parse(localStorage.getItem("scores") || "{}");
    userBestSpeed = JSON.parse(localStorage.getItem("speed") || "{}");
}

function saveData(){
    localStorage.setItem("scores", JSON.stringify(userScores));
    localStorage.setItem("speed", JSON.stringify(userBestSpeed));
}
// ---------------- LOGIN ----------------
function login(){

    myUsername = user.value;

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        status.innerText = "Connecting...";
        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:user.value,
                password:pass.value,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{

        let msg = JSON.parse(e.data);

        switch(msg.handler){

        case "3rd_login":
            loginBox.style.display="none";
            main.style.display="block";
            status.innerText="Login success";
                loadData();
            break;

        case "join_room":
            updateUsers(msg.members.map(m=>m.username));
            break;

        case "room_lists":
            updateUsers(msg.online);
            break;

        // ---------------- JOIN / LEAVE ----------------
        case "room_presence":

            if(msg.username === myUsername) return;

            if(msg.status==="update"){

                addChat(`<span class="join">🟢 ${msg.username} joined</span>`);

                let list = users.innerText.split("\n").filter(u => u);
                if(!list.includes(msg.username)) list.push(msg.username);
                updateUsers(list);

                if(welcomeToggle.checked){
                    let arr = ["Welcome!", "Hello!", "Enjoy!", "Nice to see you!"];
                    sendBot(`👋 ${msg.username}, ${arr[Math.floor(Math.random()*arr.length)]}`);
                }
            }

            if(msg.status==="left"){

                addChat(`<span class="leave">🔴 ${msg.username} left</span>`);

                let list = users.innerText.split("\n").filter(u => u !== msg.username);
                updateUsers(list);
            }

        break;

        // ---------------- MESSAGE ----------------
        case "room_msg":

            let m = msg.message;

            renderMessage(m);

            // ❌ ignore your own answer
            if(m.sender === myUsername) break;
let text = (m.body || "").toLowerCase().trim();

// ---------------- COMMAND: MYSCORE ----------------
if(text === "myscore"){

    let score = userScores[m.sender] || 0;
    let speed = userBestSpeed[m.sender];

    if(!speed){
        sendBot(`📊 ${m.sender}, you have no score yet. Play the quiz!`);
    } else {
        sendBot(`📊 ${m.sender} | Score: ${score} | Best Speed: ${speed.toFixed(2)}s`);
    }

    return;
}

// ---------------- COMMAND: TOP ----------------
if(text === "top"){

    let players = Object.keys(userScores);

    if(players.length === 0){
        sendBot("🏆 No players yet!");
        return;
    }

    // sort by score DESC
    players.sort((a,b)=> userScores[b] - userScores[a]);

    let topList = players.slice(0,10);

    let msgTop = "🏆 TOP PLAYERS:\n";

    topList.forEach((p,i)=>{
        let score = userScores[p];
        let speed = userBestSpeed[p] ? userBestSpeed[p].toFixed(2)+"s" : "-";

        msgTop += `${i+1}. ${p} | ${score} pts | ⚡ ${speed}\n`;
    });

    sendBot(msgTop);

    return;
}
            // ---------------- QUIZ CHECK ----------------
       if(quizActive && currentAnswer !== null){

    let userAnswer = parseInt(m.body);

    if(isNaN(userAnswer)) return;

// ❌ already answered this round
if(answeredThisRound.has(m.sender)) return;

// ❌ spam cooldown
let now = Date.now();
if(lastAnswerTime[m.sender] && now - lastAnswerTime[m.sender] < cooldown) return;

if(userAnswer === currentAnswer){

    answeredThisRound.add(m.sender);
    lastAnswerTime[m.sender] = now;

    let timeTaken = (now - questionStartTime) / 1000;

    let score = timeTaken <= 2 ? 100 :
                timeTaken <= 5 ? 70 :
                timeTaken <= 8 ? 50 : 30;

    if(!userScores[m.sender]){
        userScores[m.sender] = 0;
        userBestSpeed[m.sender] = 999;
    }

    userScores[m.sender] += score;

    if(timeTaken < userBestSpeed[m.sender]){
        userBestSpeed[m.sender] = timeTaken;
    }

    saveData();

    clearInterval(repeatTimer);
    currentAnswer = null;

    sendBot(`🏆 ${m.sender} +${score} (${timeTaken.toFixed(2)}s) | Total: ${userScores[m.sender]}`);

    setTimeout(nextQuestion, 4000);
}
}

        break;
        }
    };
}

// ---------------- BOT SEND ----------------
function sendBot(text){
    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: text
        }
    }));
}

// ---------------- MESSAGE ----------------
function renderMessage(m){
    addChat(`<b>${m.sender}</b>: ${m.body || ""}`);
}

// ---------------- JOIN ----------------
function joinRoom(){

    currentRoom = roomName.value;

    socket.send(JSON.stringify({
        handler:"join_room",
        payload:{ room_name: currentRoom }
    }));
}

// ---------------- SEND ----------------
function sendMsg(){

    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name: currentRoom,
            body: msg.value
        }
    }));

    msg.value="";
}

// ---------------- EMOJI ----------------
function addEmoji(e){
    msg.value += e;
}

// ---------------- QUIZ ENGINE ----------------
function nextQuestion(){

    let a = Math.floor(Math.random()*20);
    let b = Math.floor(Math.random()*20);

    currentAnswer = a + b;
    questionStartTime = Date.now();
    repeatCount = 0;

    sendBot(`🧠 QUIZ: ${a} + ${b} = ?`);

    repeatTimer = setInterval(()=>{

        repeatCount++;

        if(repeatCount >= maxRepeats){

            clearInterval(repeatTimer);

            sendBot(`❌ Time's up! Answer: ${currentAnswer}`);

            setTimeout(nextQuestion, 5000);
            answeredThisRound.clear();
            return;
        }

        sendBot(`⏳ QUIZ REPOST : ${a} + ${b} = ?`);

    },20000);
}

// ---------------- TOGGLE ----------------
function toggleMath(){

    if(mathToggle.checked){

        if(quizActive) return;

        quizActive = true;
        sendBot("🧠 Quiz Started!");
        nextQuestion();

    } else {

        quizActive = false;
        clearInterval(repeatTimer);
        sendBot("🛑 Quiz Stopped");
    }
}

</script>

</body>
</html>
