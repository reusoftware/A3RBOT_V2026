<!DOCTYPE html>
<html>
<head>
<title>🤖 A3R BOT</title>
<style>
body { font-family: Arial; background:#f5f5f5; }

#chatBox, #buzzBox, #rawBox {
    width:100%;
    height:150px;
    overflow:auto;
}

.msg {
    margin:5px 0;
    padding:5px;
    background:#fff;
    border-radius:5px;
}

.join { color:green; font-weight:bold; }
.leave { color:darkgreen; font-weight:bold; }
.system { color:#444; }
</style>
</head>

<body>

<h2>🤖 A3R BOT</h2>

<!-- LOGIN -->
<div id="loginBox">
    <input id="user" placeholder="Username"><br><br>
    <input id="pass" type="password" placeholder="Password"><br><br>
    <button onclick="login()">LOGIN</button>
    <p id="status"></p>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

<h3>ROOM</h3>
<input id="roomName" placeholder="Room name">
<button onclick="joinRoom()">JOIN</button>

<h4 id="subject"></h4>
<div id="users"></div>

<hr>

<div id="chatBox"></div>

<input id="msg" placeholder="Message">
<button onclick="sendMsg()">SEND</button>

<hr>

<h3>BUZZ</h3>
<div id="buzzBox"></div>

<hr>

<h3>RAW</h3>
<textarea id="rawBox"></textarea>

</div>

<script>

let socket;
let currentRoom = "";

const DEFAULT_AVATAR = "https://i.imgur.com/8Km9tLL.png";

// ---------------- UI HELPERS ----------------
function raw(data){
    const box = document.getElementById("rawBox");
    box.value += data + "\n";
    box.scrollTop = box.scrollHeight;
}

function addChat(html){
    const box = document.getElementById("chatBox");
    box.innerHTML += `<div class="msg">${html}</div>`;
    box.scrollTop = box.scrollHeight;
}

function addBuzz(html){
    const box = document.getElementById("buzzBox");
    box.innerHTML += `<div class="msg">${html}</div>`;
    box.scrollTop = box.scrollHeight;
}

// ---------------- LOGIN ----------------
function login(){

    const u = user.value;
    const p = pass.value;
    status.innerText = "Connecting...";

    socket = new WebSocket("wss://viberschat.space:8443/server");

    socket.onopen = () => {
        socket.send(JSON.stringify({
            handler:"3rd_login",
            payload:{
                username:u,
                password:p,
                api_key:"xYn86hjOpJk$"
            }
        }));
    };

    socket.onmessage = (e)=>{
        let msg = JSON.parse(e.data);
        raw(JSON.stringify(msg));

        switch(msg.handler){

        case "3rd_login":
            document.getElementById("loginBox").style.display="none";
            document.getElementById("main").style.display="block";
            status.innerText = "Login success";
            break;

        // ---------------- ROOM JOIN ----------------
        case "join_room":
            if(msg.status=="success"){

                subject.innerText = "📌 " + msg.subject;

                let html = "<b>👥 Members:</b><br>";
                msg.members.forEach(m=>{
                    html += "• " + m.username + " (" + m.role + ")<br>";
                });

                users.innerHTML = html;
                addChat("🏠 Joined room successfully");
            }
            break;

        // ---------------- JOIN / LEAVE ----------------
        case "room_presence":

            if(msg.status=="update"){
                addChat(`<span class="join">🟢 ${msg.username} joined the room</span>`);
            }

            if(msg.status=="left"){
                addChat(`<span class="leave">🔴 ${msg.username} left the room</span>`);
            }
            break;

        // ---------------- MESSAGE ----------------
        case "room_msg":
            renderMessage(msg.message);
            break;

        // ---------------- BUZZ ----------------
        case "new_buzz":
            renderBuzz(msg.data);
            break;
        }
    };
}

// ---------------- MESSAGE RENDER ----------------
function renderMessage(m){

    if(!m) return;

    let avatar = m.avatar_url || DEFAULT_AVATAR;
    let text = m.body || "";
    let html = `<b>${m.sender}</b>: ${text}`;

    // IMAGE / AUDIO
    if(m.attachments && m.attachments.length){

        m.attachments.forEach(url=>{

            if(url.match(/\.(jpg|jpeg|png|gif)/i)){
                html += `<br><img src="${url}" width="150">`;
            }

            else if(url.match(/\.(mp3|aac|wav|webm|ogg)/i)){
                html += `<br>
                🎧 <audio controls src="${url}"></audio>`;
            }

            else {
                html += `<br>📎 <a href="${url}" target="_blank">file</a>`;
            }
        });
    }

    addChat(html);
}

// ---------------- BUZZ ----------------
function renderBuzz(b){

    if(!b) return;

    let html =
    `<b>🔥 ${b.username}</b><br>
    ${b.content}<br>
    ❤️ ${b.likes_count || 0}<br>`;

    if(b.attachments){
        b.attachments.forEach(a=>{

            if(a.match(/\.(jpg|png|jpeg|gif)/i)){
                html += `<br><img src="${a}" width="150">`;
            }

            else if(a.match(/\.(mp3|aac|wav)/i)){
                html += `<br><audio controls src="${a}"></audio>`;
            }

            else {
                html += `<br>📎 ${a}`;
            }
        });
    }

    addBuzz(html);
}

// ---------------- JOIN ROOM ----------------
function joinRoom(){

    currentRoom = roomName.value;

    socket.send(JSON.stringify({
        handler:"join_room",
        payload:{
            room_name:currentRoom
        }
    }));

    addChat("➡️ Joining " + currentRoom);
}

// ---------------- SEND MESSAGE ----------------
function sendMsg(){

    if(!msg.value || !currentRoom) return;

    socket.send(JSON.stringify({
        handler:"room_msg",
        payload:{
            room_name:currentRoom,
            body:msg.value
        }
    }));

    addChat("ME: " + msg.value);
}

</script>

</body>
</html>
